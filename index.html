<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <link rel="canonical" href="https://miabeasi.com/" />

    <!-- Open Graph / Facebook / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://miabeasi.com/" />
    <meta property="og:title" content="Miabé Asi — Marketplace Panafricaine & Produits Nobles du Togo" />
    <meta property="og:description" content="Achetez et vendez le meilleur du made in Togo et d'Afrique : mode traditionnelle, cosmétique bio, épicerie fine et artisanat noble." />
    <meta property="og:image" content="https://miabeasi.com/official-logo.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Miabé Asi — Marketplace Panafricaine & Produits Nobles du Togo" />
    <meta name="twitter:description" content="Achetez et vendez le meilleur du made in Togo et d'Afrique : mode traditionnelle, cosmétique bio, épicerie fine et artisanat noble." />
    <meta name="twitter:image" content="https://miabeasi.com/official-logo.png" />

    <!-- Schema.org Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://miabeasi.com/#organization",
          "name": "Miabé Asi",
          "url": "https://miabeasi.com/",
          "logo": "https://miabeasi.com/official-logo.png",
          "description": "Plateforme e-commerce panafricaine de valorisation des produits nobles togolais et africains.",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Lomé",
            "addressCountry": "TG"
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://miabeasi.com/#website",
          "url": "https://miabeasi.com/",
          "name": "Miabé Asi",
          "publisher": { "@id": "https://miabeasi.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://miabeasi.com/?search={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Web App Manifest & Branding for PWA -->
    <link rel="manifest" href="/manifest.json?v=4" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=4" />
    <meta name="theme-color" content="#0F5132" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Miabé Asi" />

    <!-- Service Worker registration with graceful update management -->
    <script>
      (function() {
        const isDev = window.location.hostname.includes("run.app") || window.location.hostname.includes("localhost") || window.location.port === "3000";
        if (isDev) {
          // In development/preview on AI Studio or localhost, unregister SW and clear cache to avoid React hook version conflicts
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (let i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            });
          }
          if ("caches" in window) {
            caches.keys().then(function(names) {
              for (let i = 0; i < names.length; i++) {
                caches.delete(names[i]);
              }
            });
          }
        } else if ("serviceWorker" in navigator) {
          window.addEventListener("load", function() {
            navigator.serviceWorker.register("/sw.js?v=5").catch(function(err) {
              console.warn("[Miabé Asi PWA] Enregistrement SW:", err);
            });
          });
        }
      })();
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 selection:bg-[#d4af37]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
