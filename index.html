<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asime Togo</title>
    <!-- Web App Manifest & Branding for PWA -->
    <link rel="manifest" href="/manifest.json?v=3" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <meta name="theme-color" content="#0F5132" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Force Service Worker unregistration & Cache clearance to ensure instant live updates on mobile -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          for (let registration of registrations) {
            registration.unregister().then((success) => {
              if (success) console.log("Service Worker désenregistré pour assurer les mises à jour en direct.");
            });
          }
        });
      }
      if ("caches" in window) {
        caches.keys().then((names) => {
          for (let name of names) {
            caches.delete(name).then(() => {
              console.log("Cache nettoyé :", name);
            });
          }
        });
      }
    </script>
  </head>
  <body class="bg-neutral-50 text-neutral-900 selection:bg-[#d4af37]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
